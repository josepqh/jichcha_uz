name: universe

# Every container keeps at most 3 x 10 MB of logs, so a chatty service cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  # Built once by the `backend` service; the other services reuse the same image.
  image: universe-backend:dev
  pull_policy: never
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgres://${POSTGRES_USER:-universe}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-universe}
    REDIS_URL: redis://cache:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS_DOCKER:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    MEDIA_ROOT: /data/media
    # .env holds host paths for local dev (macOS app bundles); inside the images these are on PATH.
    SOFFICE_BINARY: soffice
    CLAMAV_HOST: clamav
  volumes:
    - media:/data/media
  restart: unless-stopped

# Workers parse untrusted files: no network, no capabilities, read-only root filesystem.
# Scratch space is the per-container volume at /data/work (TMPDIR).
x-hardened: &hardened
  networks: [internal]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  db:
    logging: *logging
    image: postgres:18.1-alpine
    restart: unless-stopped
    networks: [default, internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  db-backup:
    logging: *logging
    build:
      context: ./deploy
      dockerfile: backup.Dockerfile
    image: universe-backup:dev
    restart: unless-stopped
    # tini as PID 1: "docker compose stop/up" ends the container at once instead of killing it after
    # 10 s (a killed container mid-recreate left a renamed copy behind and blocked the next "up").
    init: true
    # default network: it reaches Postgres there, and the internet for the off-site copy.
    networks: [default]
    # Off-site storage credentials (rclone RCLONE_CONFIG_* variables) live in their own file, so this
    # container never sees the app's secrets. See README "Backups".
    env_file:
      - path: ./backup.env
        required: false
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-universe}
      PGUSER: ${POSTGRES_USER:-universe}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - backups:/backups
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  cache:
    logging: *logging
    image: redis:8.2-alpine
    restart: unless-stopped
    networks: [default, internal]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  clamav:
    logging: *logging
    # Multi-arch build of the official ClamAV image (the plain one has no arm64 variant).
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    # default network: freshclam downloads signature updates; internal: workers reach clamd.
    networks: [default, internal]
    environment:
      # Must cover the largest upload (registered users: 200 MB per file).
      CLAMD_CONF_StreamMaxLength: 210M
      CLAMD_CONF_MaxFileSize: 210M
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g

  migrate:
    logging: *logging
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    logging: *logging
    <<: *backend
    build:
      context: ./backend
      # The last Dockerfile stage is the heavy office image; the API and light worker need only this.
      target: runtime
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy

  worker:
    logging: *logging
    <<: [*backend, *hardened]
    command: ["celery", "-A", "config", "worker", "-Q", "light,maintenance", "--concurrency", "2", "--loglevel", "info"]
    volumes:
      - media:/data/media
      - work-light:/data/work
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker-office:
    logging: *logging
    <<: [*backend, *hardened]
    image: universe-backend-office:dev
    build:
      context: ./backend
      target: runtime-office
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    pull_policy: build
    command: ["celery", "-A", "config", "worker", "-Q", "office", "--concurrency", "2", "--loglevel", "info"]
    volumes:
      - media:/data/media
      - work-office:/data/work
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      clamav:
        condition: service_healthy

  monitor:
    logging: *logging
    # Alerts on Telegram (ALERT_TELEGRAM_CHAT_ID). On the default network: it needs the internet.
    <<: *backend
    command: ["python", "manage.py", "monitor", "--interval", "300"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy

  beat:
    logging: *logging
    <<: *backend
    networks: [internal]
    command: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    volumes: []
    healthcheck:
      disable: true
    depends_on:
      cache:
        condition: service_healthy

  bot:
    logging: *logging
    # Telegram bot. Opt-in: `docker compose --profile bot up -d` (needs TELEGRAM_BOT_TOKEN and BOT_API_SECRET).
    profiles: ["bot"]
    build: ./bot
    image: universe-bot:dev
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_BACKEND_URL: http://backend:8000
      BOT_REDIS_URL: redis://cache:6379/1
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    # default network only: it needs the internet (Telegram API) and the backend.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      backend:
        condition: service_healthy
      cache:
        condition: service_healthy

  web:
    logging: *logging
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        SITE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    image: universe-web:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  # No route to the internet: conversion workers parse untrusted files (LibreOffice may follow
  # remote links inside documents), so they can reach only Postgres and Redis.
  internal:
    internal: true

volumes:
  pgdata:
  media:
  work-light:
  work-office:
  clamav-db:
  backups:
