name: universe

x-backend: &backend
  # Built once by the `backend` service; the other services reuse the same image.
  image: universe-backend:dev
  pull_policy: never
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgres://${POSTGRES_USER:-universe}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-universe}
    REDIS_URL: redis://cache:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS_DOCKER:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    MEDIA_ROOT: /data/media
    # .env holds host paths for local dev (macOS app bundles); inside the images these are on PATH.
    SOFFICE_BINARY: soffice
    EBOOK_CONVERT_BINARY: ebook-convert
    CLAMAV_HOST: clamav
  volumes:
    - media:/data/media
  restart: unless-stopped

# Workers parse untrusted files: no network, no capabilities, read-only root filesystem.
# Scratch space is the per-container volume at /data/work (TMPDIR).
x-hardened: &hardened
  networks: [internal]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  db:
    image: postgres:18.1-alpine
    restart: unless-stopped
    networks: [default, internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  db-backup:
    image: postgres:18.1-alpine
    restart: unless-stopped
    networks: [internal]
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-universe}
      PGUSER: ${POSTGRES_USER:-universe}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  cache:
    image: redis:8.2-alpine
    restart: unless-stopped
    networks: [default, internal]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  clamav:
    # Multi-arch build of the official ClamAV image (the plain one has no arm64 variant).
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    # default network: freshclam downloads signature updates; internal: workers reach clamd.
    networks: [default, internal]
    environment:
      # Must cover the largest upload (registered users: 200 MB per file).
      CLAMD_CONF_StreamMaxLength: 210M
      CLAMD_CONF_MaxFileSize: 210M
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: ./backend
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy

  worker:
    <<: [*backend, *hardened]
    command: ["celery", "-A", "config", "worker", "-Q", "light,maintenance", "--concurrency", "2", "--loglevel", "info"]
    volumes:
      - media:/data/media
      - work-light:/data/work
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker-office:
    <<: [*backend, *hardened]
    image: universe-backend-office:dev
    build:
      context: ./backend
      target: runtime-office
    pull_policy: build
    command: ["celery", "-A", "config", "worker", "-Q", "office,ebook", "--concurrency", "2", "--loglevel", "info"]
    volumes:
      - media:/data/media
      - work-office:/data/work
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      clamav:
        condition: service_healthy

  beat:
    <<: *backend
    networks: [internal]
    command: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    volumes: []
    healthcheck:
      disable: true
    depends_on:
      cache:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    image: universe-web:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  # No route to the internet: conversion workers parse untrusted files (LibreOffice may follow
  # remote links inside documents), so they can reach only Postgres and Redis.
  internal:
    internal: true

volumes:
  pgdata:
  media:
  work-light:
  work-office:
  clamav-db:
  backups:
