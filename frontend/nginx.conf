server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Registered users may send up to 500 MB per request (LimitPolicy.max_total_mb).
    client_max_body_size 520m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; script-src 'self' https://accounts.google.com/gsi/client 'sha256-hFXE6ZdaMkAj2Uydsu2eYCSlPVEPhNw/t+d/oSuBLRE='; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Telegram webhook (production). Resolved per request so nginx starts even when the bot
    # service is not running; Telegram's secret_token header is checked by the bot itself.
    location = /telegram/webhook {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $bot_upstream http://bot:8081;
        client_max_body_size 1m;
        proxy_pass $bot_upstream;
        proxy_set_header Host $host;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only the Telegram bot (inside the Docker network) may send these; never accept them from outside.
        proxy_set_header X-Bot-Secret "";
        proxy_set_header X-Telegram-User-Id "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # nginx's mime.types has no .mjs; browsers refuse a module worker (pdf.js) sent as octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; script-src 'self' https://accounts.google.com/gsi/client 'sha256-hFXE6ZdaMkAj2Uydsu2eYCSlPVEPhNw/t+d/oSuBLRE='; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # Prerendered pages first (dist/<lang>/<path>/index.html), then the app shell.
        try_files $uri $uri/index.html /index.html;
    }
}
